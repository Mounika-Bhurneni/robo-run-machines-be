AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: HTTP API

Parameters:
  ParamDBHost:
    Type: String
  ParamDBUser:
    Type: String
  ParamDBPassword:
    Type: String
    NoEcho: true
  ParamDBName:
    Type: String
  ParamDBPort:
    Type: String
    Default: "3306"

  # Composio and Jira
  ParamComposioKey:
    Type: String
    NoEcho: true
  ParamJiraInstanceUrl:
    Type: String
  ParamJiraEmail:
    Type: String
  ParamJiraApiToken:
    Type: String
    NoEcho: true
  ParamUserPoolId:
    Type: String
    Description: Cognito User Pool ID

  ParamUserPoolId:
    Type: String

  ParamCognitoClientId:
    Type: String

  ParamCognitoClientSecret:
    Type: String
    NoEcho: true


Globals:
  Function:
    Timeout: 60
    Handler: app.lambda_handler
    Runtime: python3.10
    Environment:
      Variables:
        DB_HOST: !Ref ParamDBHost
        DB_USER: !Ref ParamDBUser
        DB_PASSWORD: !Ref ParamDBPassword
        DB_NAME: !Ref ParamDBName
        DB_PORT: !Ref ParamDBPort

Resources:

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods: [GET, POST]
        AllowOrigins: ["*"]
        AllowHeaders: ["*"]

  MyLibLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: common_libraries
      CompatibleRuntimes:
        - python3.10
    Metadata:
      BuildMethod: python3.10

  LambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-lambda-function"
      CodeUri: hello_world/
      Layers:
        - !Ref MyLibLayer
      Events:
        RootGet:
          Type: HttpApi
          Properties:
            Path: /
            Method: get
            ApiId: !Ref HttpApi

  SimpleAuthLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-simple-auth"
      CodeUri: hello_world/
      Layers:
        - !Ref MyLibLayer
      Events:
        RootGet:
          Type: HttpApi
          Properties:
            Path: /simple
            Method: get
            ApiId: !Ref HttpApi

  TestEndpointFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-test-endpoint"
      CodeUri: test_endpoint/
      Layers:
        - !Ref MyLibLayer
      Events:
        TestPost:
          Type: HttpApi
          Properties:
            Path: /test
            Method: post
            ApiId: !Ref HttpApi
      Environment:
        Variables:
          DB_HOST: !Ref ParamDBHost
          DB_USER: !Ref ParamDBUser
          DB_PASSWORD: !Ref ParamDBPassword
          DB_NAME: !Ref ParamDBName
          DB_PORT: !Ref ParamDBPort

  JiraAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-jira-agent"
      CodeUri: jira_agent/
      Handler: app.lambda_handler
      Runtime: python3.10
      Timeout: 30
      MemorySize: 512
      Layers:
        - !Ref MyLibLayer
      Events:
        JiraPost:
          Type: HttpApi
          Properties:
            Path: /jira/agent
            Method: post
            ApiId: !Ref HttpApi
      Environment:
        Variables:
          COMPOSIO_API_KEY: !Ref ParamComposioKey
          JIRA_INSTANCE_URL: !Ref ParamJiraInstanceUrl
          JIRA_EMAIL: !Ref ParamJiraEmail
          JIRA_API_TOKEN: !Ref ParamJiraApiToken

  ComposioUserDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-composio-user-data"
      CodeUri: composio_user/
      Handler: app.lambda_handler
      Runtime: python3.10
      Timeout: 30
      MemorySize: 512
      Layers:
        - !Ref MyLibLayer
      Events:
        ComposioUserDataPost:
          Type: HttpApi
          Properties:
            Path: /composio/user/data
            Method: post
            ApiId: !Ref HttpApi
      Environment:
        Variables:
          COMPOSIO_API_KEY: !Ref ParamComposioKey
          COMPOSIO_BASE_URL: "https://api.composio.dev"

  CognitoCreateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-cognito-create-user"
      CodeUri: cognito_create_user/
      Handler: app.lambda_handler
      Runtime: python3.10
      Timeout: 30
      MemorySize: 256
      Policies:
        - AmazonCognitoPowerUser
      Events:
        CreateUser:
          Type: HttpApi
          Properties:
            Path: /cognito/create-user
            Method: post
            ApiId: !Ref HttpApi
      Environment:
        Variables:
          USER_POOL_ID: !Ref ParamUserPoolId


  CognitoLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-cognito-login"
      CodeUri: cognito_login/
      Handler: app.lambda_handler
      Runtime: python3.10
      Timeout: 30
      MemorySize: 512
      Layers:
        - !Ref MyLibLayer
      Events:
        LoginPost:
          Type: HttpApi
          Properties:
            Path: /auth/login
            Method: post
            ApiId: !Ref HttpApi
      Environment:
        Variables:
          USER_POOL_ID: !Ref ParamUserPoolId
          CLIENT_ID: !Ref ParamCognitoClientId
          CLIENT_SECRET: !Ref ParamCognitoClientSecret


Outputs:
  HttpApiUrl:
    Description: "Base URL for the HTTP API"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
